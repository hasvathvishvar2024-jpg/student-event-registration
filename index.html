<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
        }

        h1 {
            text-align: center;
        }

        h2 {
            color: #333333;
        }

        p {
            line-height: 1.5;
        }

        .version {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #333333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #555555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Event Registration</h1>

        <h2>Annual Technical Symposium 2026 - Registration Open</h2>

        <p>
            Tech Fest 2026 is a college technical event featuring
            exciting competitions, workshops and technical activities.
        </p>

        <p class="version">
            Application Version: v2
        </p>

        <form>

            <label for="studentName">Student Name:</label>
            <input
                type="text"
                id="studentName"
                name="studentName"
                value="R.Hasvath Vishva"
                required
            >

            <label for="registerNumber">Register Number:</label>
            <input
                type="text"
                id="registerNumber"
                name="registerNumber"
                value="24MIS0111"
                required
            >

            <label for="department">Department:</label>
            <input
                type="text"
                id="department"
                name="department"
                value="Software Engineering"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                value="hasvathvishva007@gmail.com"
                required
            >

            <label for="eventDate">Event Date:</label>
            <input
                type="date"
                id="eventDate"
                name="eventDate"
                value="2026-10-20"
                required
            >

            <button type="submit">Register Now</button>

        </form>

    </div>

</body>
</html>
